# MetaLayer Server — multi-user profile with Redis + Postgres
services:
  metalayer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: ghcr.io/metalayer/metalayer-server:latest
    container_name: metalayer-server
    ports:
      - "1338:1338"
    environment:
      METALAYER_DEPLOYMENT_MODE: server
      METALAYER_API_PORT: "1338"
      POSTGRES_URL: postgresql://metalayer:metalayer@postgres:5432/metalayer
      REDIS_URL: redis://redis:6379
      METALAYER_TELEMETRY_ENABLED: "false"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: metalayer-redis
    restart: unless-stopped
    volumes:
      - metalayer_redis:/data

  postgres:
    image: postgres:16-alpine
    container_name: metalayer-postgres
    environment:
      POSTGRES_USER: metalayer
      POSTGRES_PASSWORD: metalayer
      POSTGRES_DB: metalayer
    volumes:
      - metalayer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metalayer -d metalayer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  metalayer_redis:
  metalayer_postgres:
