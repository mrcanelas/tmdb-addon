name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: i18n check
        run: npm run i18n:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build MetaLayer configure
        run: npm run build:configure

      - name: Build MetaLayer API
        run: npm run build:api
