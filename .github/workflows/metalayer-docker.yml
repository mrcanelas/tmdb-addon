name: Publish MetaLayer Docker images (GHCR)

on:
  push:
    tags:
      - 'metalayer-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 1.0.0-alpha.1)'
        required: true

jobs:
  metalayer-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set release tags
        id: tags
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME#metalayer-v}}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo 'Invalid release tag'
            exit 1
          fi
          CHANNEL=latest
          if [[ "$TAG" == *-* ]]; then
            CHANNEL="${TAG#*-}"
            CHANNEL="${CHANNEL%%.*}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Lite
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.lite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/metalayer-lite:${{ steps.tags.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/metalayer-lite:${{ steps.tags.outputs.channel }}

      - name: Build and push Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/metalayer-server:${{ steps.tags.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/metalayer-server:${{ steps.tags.outputs.channel }}
